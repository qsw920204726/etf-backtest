  @media (prefers-color-scheme: dark) { :root { color-scheme: dark;

  .form input,.form select { background:var(--page); color:var(--tp); border:1px solid var(--border); border-radius:6px; padding:6px; font-size:13px; width:100%; }

  #navChart{height:230px} #ddChart{height:150px}
  details { margin-bottom:12px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }

  #toast { position:fixed; left:50%; transform:translateX(-50%); bottom:24px; background:var(--tp); color:var(--page);
    padding:8px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90%; }
  .loading { opacity:.45; }

<body>
<div class="wrap">
  <h1>ETF 动量轮动 <small id="asOfTag"></small></h1>

  <div class="card">
    <h2>今日操作信号</h2>
    <div class="sub" id="sigSub">信号按收盘价产生，实际操作在次一交易日开盘执行</div>
    <div class="cap">我的总资产 <input id="cap" type="number" value="100000" step="1000"> 元</div>
    <table><thead><tr><th>操作</th><th>ETF</th><th>仓位</th><th>参考价</th><th>建议下单</th></tr></thead>
      <tbody id="sigBody"><tr><td colspan="5" style="text-align:center;color:var(--tm)">计算中…</td></tr></tbody></table>
    <div class="sub" id="sigNote" style="margin-top:6px"></div>
  </div>

  <div class="card">
    <h2>轮动依据 · 动量排名</h2>
    <div class="sub" id="rankSub">动量分 = 近N日涨幅/波动，前N名持有</div>
    <table><thead><tr><th>#</th><th>ETF</th><th>动量分</th><th>涨幅</th><th>状态</th></tr></thead>
      <tbody id="rankBody"><tr><td colspan="5" style="text-align:center;color:var(--tm)">计算中…</td></tr></tbody></table>
  </div>

  <div class="card">
    <h2>回测参数</h2>
    <div class="form">
      <label>持有只数<input id="topN" type="number" value="3" min="1" max="5"></label>
      <label>动量窗口(日)<input id="lookback" type="number" value="20" min="5" max="250"></label>
      <label>频率<select id="freq"><option value="W" selected>每周</option><option value="M">月末</option></select></label>
      <label>风险调整<select id="riskAdj"><option value="1" selected>开</option><option value="0">关</option></select></label>
      <label>开始<input id="start" type="date" value="2015-01-01"></label>
      <label>资金(万)<input id="cashW" type="number" value="10" min="1"></label>
      <label class="wide"><input id="absF" type="checkbox" checked>绝对动量过滤（全场无正动量→持币）</label>
    </div>
    <div class="btnrow">
      <button id="runBtn">运行回测</button>
      <button id="refreshBtn" class="ghost">更新数据</button>
    </div>
  </div>

  <div class="kpis" id="kpis">
    <div class="tile"><div class="label">期末资产</div><div class="value" id="k-final">—</div><div class="delta flat" id="k-final-d"></div></div>
    <div class="tile"><div class="label">年化收益（基准）</div><div class="value" id="k-ann">—</div><div class="delta" id="k-ann-d"></div></div>
    <div class="tile"><div class="label">最大回撤（基准）</div><div class="value" id="k-dd">—</div><div class="delta" id="k-dd-d"></div></div>
    <div class="tile"><div class="label">夏普 / 月胜率</div><div class="value" id="k-sharpe">—</div><div class="delta flat" id="k-turn"></div></div>
  </div>

  <div class="card"><h2>策略 vs 沪深300 买入持有</h2><div id="navChart"></div></div>
  <div class="card"><h2>策略回撤</h2><div id="ddChart"></div></div>
  <details><summary>交易明细（最近50笔）</summary>
    <div style="max-height:320px;overflow:auto;margin-top:8px">
    <table><thead><tr><th>日期</th><th>方向</th><th>ETF</th><th>份额</th><th>价格</th></tr></thead><tbody id="trBody"></tbody></table></div>
  </details>
  <div class="sub" style="text-align:center;margin-top:4px">佣金万2.5 · T+1 · 100股取整 · 引擎与桌面版同口径</div>
</div>
<div id="toast"></div>

<script src="echarts.min.js"></script>
<script src="data.js"></script>
<script>
'use strict';
const D = window.ETF_DATA;
const $ = id => document.getElementById(id);
const fmt = new Intl.NumberFormat('zh-CN');
const pct = x => (x*100).toFixed(1) + '%';
const spct = x => (x>=0?'+':'') + (x*100).toFixed(1) + '%';

function toast(msg, ms=2600) {
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, ms);
}

// ============ 引擎（与 Python 版同口径） ============
function rebalanceDates(freq) {
  const set = new Set(); let lastKey = null;
  D.dates.forEach((d, i) => {
    const dt = new Date(d); const ymd = d.split('-');
    const key = freq === 'M' ? ymd[0]+'-'+ymd[1]
      : ymd[0] + '-' + isoWeek(dt);
    if (key !== lastKey && lastKey !== null) set.add(i - 1);
    lastKey = key;
  });
  set.add(D.dates.length - 1);
  return set;
}
function isoWeek(dt) { // ISO 周号（周一为一周之始）
  const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - y0) / 864e5) + 1) / 7);
}
function momentumAt(i, lookback, riskAdj) {
  const out = [];
  for (const c of D.codes) {
    const cl = D.close[c];
    if (cl[i] == null || cl[i - lookback] == null) continue;
    let ok = true;
    for (let k = i - lookback; k <= i; k++) if (cl[k] == null) { ok = false; break; }
    if (!ok) continue;
    const ret = cl[i] / cl[i - lookback] - 1;
    if (riskAdj) {
      let s = 0, s2 = 0, n = 0;
      for (let k = i - lookback + 1; k <= i; k++) {
        const r = cl[k] / cl[k-1] - 1; s += r; s2 += r*r; n++;
      }
      const std = Math.sqrt(Math.max(s2/n - (s/n)*(s/n), 0)) * Math.sqrt(lookback);
      if (!(std > 0)) continue;
      out.push([c, ret / std]);
    } else out.push([c, ret]);
  }
  out.sort((a, b) => b[1] - a[1]);
  return out;
}
function targetsAt(i, P) {
  if (!P.rbDates.has(i)) return null;
  const mom = momentumAt(i, P.lookback, P.riskAdj);
  if (!mom.length) return {};
  if (P.absFilter && mom[0][1] <= 0) return {};
  return mom.slice(0, P.topN).reduce((m, x) => (m[x[0]] = 1 / Math.min(P.topN, mom.length), m), {});
}
function runBacktest(P) {
  const s0 = D.dates.indexOf(D.dates.find(d => d >= P.start));
  const idx = []; for (let i = s0; i < D.dates.length; i++) idx.push(i);
  let cash = P.cash, pending = null, lastCloses = null;
  const pos = {};   // code -> {shares, avail}
  const trades = [], nav = [], bench0 = D.close[D.bench][s0];
  let curW = {};

  const valuate = i => { let v = cash; for (const c in pos) v += pos[c].shares * D.close[c][i]; return v; };

  for (const i of idx) {
    // ---- 开盘执行 ----
    if (pending) {
      const total = (() => { let v = cash; for (const c in pos) v += pos[c].shares * lastCloses[c]; return v; })();
      const changed = [...new Set([...Object.keys(curW), ...Object.keys(pending)])]
        .some(c => Math.abs((curW[c]||0) - (pending[c]||0)) > 0.02);
      if (changed && total > 0) {
        // 先卖
        for (const c in pos) {
          const p = pos[c]; if (!p.shares) continue;
          const price = D.open[c][i]; if (price == null) continue;
          const tv = total * (pending[c] || 0), cv = p.shares * price;
          if (tv >= cv * 0.995) continue;
          let shares = pending[c] ? Math.floor((cv - tv) / price / 100) * 100 : p.avail;
          shares = Math.min(shares, p.avail); if (shares <= 0) continue;
          const execP = price * (1 - P.slippage);
          const comm = Math.max(shares * execP * P.commRate, P.minComm);
          cash += shares * execP - comm;
          p.shares -= shares; p.avail -= shares;
          trades.push([i, c, 'sell', shares, execP, comm]);
        }
        for (const c in pos) if (!pos[c].shares) delete pos[c];
        // 后买：预算按"尚未成交的买单权重"分配（否则最后一只永远买不满）
        const remW = {}; for (const [c, w] of Object.entries(pending)) if (w > 0) remW[c] = w;
        for (const [c, w] of Object.entries(pending).sort()) {
          if (w <= 0) continue;
          const price = D.open[c][i]; if (price == null) { delete remW[c]; continue; }
          const held = pos[c] ? pos[c].shares * price : 0;
          const alloc = total * w - held; if (alloc < 500) { delete remW[c]; continue; }
          const remSum = Object.values(remW).reduce((a,b)=>a+b, 0);
          const budget = Math.min(alloc, cash * w / remSum);
          delete remW[c];
          let shares = Math.floor(budget / price / 100) * 100; if (shares <= 0) continue;
          const execP = price * (1 + P.slippage);
          let comm = Math.max(shares * execP * P.commRate, P.minComm);
          while (shares > 0 && shares * execP + comm > cash) {
            shares -= 100; comm = Math.max(shares * execP * P.commRate, P.minComm);
          }
          if (shares <= 0) continue;
          cash -= shares * execP + comm;
          if (!pos[c]) pos[c] = {shares:0, avail:0};
          pos[c].shares += shares;  // 当日买入冻结，日终解冻
          trades.push([i, c, 'buy', shares, execP, comm]);
        }
      }
      pending = null;
    }
    for (const c in pos) pos[c].avail = pos[c].shares;  // T+1 日终解冻
    // ---- 收盘估值 ----
    const v = valuate(i);
    nav.push([D.dates[i], v, D.close[D.bench][i] / bench0 * P.cash]);
    curW = {}; if (v > 0) for (const c in pos) curW[c] = pos[c].shares * D.close[c][i] / v;
    lastCloses = {}; for (const c of D.codes) lastCloses[c] = D.close[c][i];
    // ---- 信号 ----
    if (i < idx[idx.length - 1]) {
      const t = targetsAt(i, P);
      if (t !== null) pending = t;
    }
  }
  return { nav, trades };
}
function metrics(nav, trades, cash) {
  const n = nav.length;
  const total = nav[n-1][1] / nav[0][1] - 1;
  const ann = Math.pow(nav[n-1][1] / nav[0][1], 252 / n) - 1;
  let peak = -Infinity, mdd = 0;
  const ddSeries = [];
  for (const [, v] of nav) { peak = Math.max(peak, v); const dd = v / peak - 1;
    ddSeries.push(dd * 100); if (dd < mdd) mdd = dd; }
  let s = 0, s2 = 0;
  for (let k = 1; k < n; k++) { const r = nav[k][1]/nav[k-1][1] - 1; s += r; s2 += r*r; }
  const std = Math.sqrt(Math.max(s2/(n-1) - s*s/((n-1)*(n-1))*n/(n-1), 0));
  const sharpe = std > 0 ? (s/(n-1)) / (Math.sqrt(s2/(n-1) - (s/(n-1))**2)) * Math.sqrt(252) : 0;
  const b = nav.map(x => x[2]);
  let bp = -Infinity, bmdd = 0; for (const v of b) { bp = Math.max(bp, v); bmdd = Math.min(bmdd, v/bp - 1); }
  const bann = Math.pow(b[n-1]/b[0], 252/n) - 1;
  // 月胜率
  const mLast = {}; for (const [d, v] of nav) mLast[d.slice(0,7)] = v;
  const months = Object.keys(mLast).sort();
  let wins = 0, cnt = 0;
  for (let k = 1; k < months.length; k++) {
    const prev = nav.find(x => x[0].startsWith(months[k-1]))[1];
    if (mLast[months[k]] > prev) wins++; cnt++;
  }
  const buyVal = trades.filter(t => t[2]==='buy').reduce((a,t) => a + t[3]*t[4], 0);
  const avgV = nav.reduce((a,x) => a + x[1], 0) / n;
  return { total, ann, mdd, sharpe, bann, bmdd, ddSeries,
    win: cnt ? wins/cnt : 0, turn: buyVal / avgV / (n/252), comm: trades.reduce((a,t)=>a+t[5],0) };
}

// ============ 信号（与桌面 API 同逻辑） ============
function signal(P) {
  const today = D.dates.length - 1;
  const rb = [...P.rbDates].sort((a,b) => a-b);
  const complete = freq => {
    const d = new Date(D.dates[today]);
    if (freq === 'M') {
      const me = new Date(d.getFullYear(), d.getMonth()+1, 0);
      for (let k = new Date(d); k <= me; k.setDate(k.getDate()+1))
        if (k.getDay() >= 1 && k.getDay() <= 5 && k > d) return false;
      return true;
    }
    const fri = new Date(d); fri.setDate(d.getDate() + (5 - d.getDay() + 7) % 7);
    for (let k = new Date(d); k < fri; k.setDate(k.getDate()+1))
      if (k.getDay() >= 1 && k.getDay() <= 5 && k > d) return false;
    return true;
  };
  const genuine = rb.filter(i => i < today || complete(P.freq));
  const sd = genuine[genuine.length - 1];
  const isRB = sd === today;
  const cur = targetsAt(sd, P);
  const prev = genuine.length > 1 ? targetsAt(genuine[genuine.length-2], P) : null;
  return { today, sd, isRB, cur, prev };
}
function nextRebalance() {
  const d = new Date(D.asOf);
  const fri = new Date(d); fri.setDate(d.getDate() + (5 - d.getDay() + 7) % 7);
  const hasDays = (() => { for (let k = new Date(d); k < fri; k.setDate(k.getDate()+1))
    if (k.getDay() >= 1 && k.getDay() <= 5 && k > d) return true; return false; })();
  return (hasDays ? fri : new Date(fri.getTime() + 7*864e5)).toISOString().slice(0,10);
}

// ============ 渲染 ============
function getParams() {
  return { topN: +$('topN').value || 3, lookback: +$('lookback').value || 20,
    freq: $('freq').value, riskAdj: $('riskAdj').value === '1',
    absFilter: $('absF').checked, start: $('start').value || '2015-01-01',
    cash: (+$('cashW').value || 10) * 10000,
    commRate: 0.00025, minComm: 0, slippage: 0,
    rbDates: rebalanceDates($('freq').value) };
}
function renderSignal() {
  const P = getParams();
  const s = signal(P);
  const tbody = $('sigBody'); tbody.textContent = '';
  const cap = +$('cap').value || 100000;
  const rows = [];

  // 轮动依据排名（同一次计算）
  const rb = $('rankBody'); rb.textContent = '';
  const mom = momentumAt(s.today, P.lookback, P.riskAdj);
  const selCodes = new Set(s.cur ? Object.keys(s.cur) : []);
  mom.forEach(([c, score], i) => {
    let ret = null, n = 0;
    const cl = D.close[c];
    for (let k = s.today - P.lookback; k <= s.today; k++) if (cl[k] != null) n++;
    if (cl[s.today] != null && cl[s.today - P.lookback] != null)
      ret = cl[s.today] / cl[s.today - P.lookback] - 1;
    const tr = document.createElement('tr');
    [String(i+1), D.names[c]+' '+c, score.toFixed(2), ret==null?'—':(ret*100).toFixed(1)+'%',
     selCodes.has(c) ? '✓持有' : '']
      .forEach((v, k) => { const td = document.createElement('td'); td.textContent = v;
        if (k >= 2) td.className = 'num'; tr.appendChild(td); });
    if (selCodes.has(c)) tr.style.background = 'color-mix(in srgb, var(--good) 9%, transparent)';
    rb.appendChild(tr);
  });
  $('rankSub').textContent = `动量分 = 近${P.lookback}日涨幅/波动 · ${D.dates[s.today]} 计算`;
  if (s.isRB && s.cur && Object.keys(s.cur).length === 0) {
    rows.push(['clear', '全部持仓', '持币', '—', '全部卖出']);
  } else if (s.isRB && s.cur) {
    const oldC = new Set(s.prev ? Object.keys(s.prev) : []);
    const newC = new Set(Object.keys(s.cur));
    const ref = c => D.rawLast[c] != null ? D.rawLast[c].toFixed(3) : '—';
    const shareRow = c => {
      const p = D.rawLast[c]; if (!p) return '—';
      const sh = Math.floor(cap * s.cur[c] / p / 100) * 100;
      return `${fmt.format(sh)}股`;
    };
    for (const c of [...oldC].filter(c => !newC.has(c)).sort())
      rows.push(['sell', D.names[c]+' '+c, '—', ref(c), '全部持仓']);
    for (const c of [...oldC].filter(c => newC.has(c)) .sort())
      rows.push(['keep', D.names[c]+' '+c, Math.round(s.cur[c]*100)+'%', ref(c), '不动']);
    for (const c of [...newC].filter(c => !oldC.has(c)).sort())
      rows.push(['buy', D.names[c]+' '+c, Math.round(s.cur[c]*100)+'%', ref(c), shareRow(c)]);
  } else if (s.cur) {
    for (const [c, w] of Object.entries(s.cur)) {
      const p = D.rawLast[c]; const sh = p ? Math.floor(cap * w / p / 100) * 100 : 0;
      rows.push(['keep', D.names[c]+' '+c, Math.round(w*100)+'%',
        p != null ? p.toFixed(3) : '—', fmt.format(sh)+'股']);
    }
  }
  const opName = {sell:'卖出', buy:'买入', keep:'持有', clear:'清仓'};
  for (const [op, name, w, price, order] of rows) {
    const tr = document.createElement('tr');
    [opName[op], name, w, price, order].forEach((v, k) => {
      const td = document.createElement('td');
      td.textContent = v; if (k === 0) td.className = 'op-' + op;
      if (k >= 2) td.className = (k===0?td.className+' ':'') + 'num';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  $('sigSub').textContent = `数据截至 ${D.asOf}` + (s.isRB ? ' · 今日为调仓日，次日开盘执行' : ` · 非调仓日，维持持仓（${D.dates[s.sd]} 确立）`);
  $('sigNote').textContent = s.isRB ? '先卖后买 · 100股取整 · 限价单贴盘口'
    : `下一次调仓日：${nextRebalance()}（周五收盘后看新信号）`;
}
let CHARTS = {};
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function renderCharts(result, m) {
  const p = { t: cssVar('--tp'), tm: cssVar('--tm'), grid: cssVar('--grid'),
    base: cssVar('--baseline'), s1: cssVar('--s1'), s2: cssVar('--s2'), s3: cssVar('--s3'), surf: cssVar('--surface') };
  const dates = result.nav.map(x => x[0]);
  const mk = id => { if (CHARTS[id]) CHARTS[id].dispose();
    CHARTS[id] = echarts.init($(id)); return CHARTS[id]; };
  mk('navChart').setOption({
    animation:false, grid:{left:58,right:14,top:28,bottom:24},
    legend:{top:0,textStyle:{color:p.tm},itemWidth:12,itemHeight:4},
    tooltip:{trigger:'axis',backgroundColor:p.surf,borderColor:p.base,textStyle:{color:p.t},
      axisPointer:{lineStyle:{color:p.base}}},
    xAxis:{type:'category',data:dates,axisLabel:{color:p.tm,fontSize:10,hideOverlap:true},
      axisLine:{lineStyle:{color:p.base}}},
    yAxis:{type:'value',scale:true,axisLabel:{color:p.tm,fontSize:10,
      formatter:v=>(v/10000).toFixed(0)+'万'},splitLine:{lineStyle:{color:p.grid}}},
    series:[
      {name:'轮动策略',type:'line',data:result.nav.map(x=>Math.round(x[1])),symbol:'none',
       lineStyle:{width:2},color:p.s1},
      {name:'沪深300',type:'line',data:result.nav.map(x=>Math.round(x[2])),symbol:'none',
       lineStyle:{width:2},color:p.s2},
    ]});
  mk('ddChart').setOption({
    animation:false, grid:{left:48,right:14,top:8,bottom:24},
    tooltip:{trigger:'axis',backgroundColor:p.surf,borderColor:p.base,textStyle:{color:p.t},
      axisPointer:{lineStyle:{color:p.base}},valueFormatter:v=>v.toFixed(1)+'%'},
    xAxis:{type:'category',data:dates,axisLabel:{color:p.tm,fontSize:10,hideOverlap:true},
      axisLine:{lineStyle:{color:p.base}}},
    yAxis:{type:'value',max:0,axisLabel:{color:p.tm,fontSize:10,formatter:'{value}%'},
      splitLine:{lineStyle:{color:p.grid}}},
    series:[{type:'line',data:m.ddSeries.map(x=>+x.toFixed(2)),symbol:'none',color:p.s3,
      lineStyle:{width:2},areaStyle:{color:p.s3,opacity:.1}}]});
}
function renderAll() {
  renderSignal();
  const P = getParams();
  $('navChart').classList.add('loading'); $('ddChart').classList.add('loading');
  setTimeout(() => {  // 让 UI 先响应
    const result = runBacktest(P);
    const m = metrics(result.nav, result.trades, P.cash);
    const last = result.nav[result.nav.length-1][1];
    $('k-final').textContent = fmt.format(Math.round(last));
    $('k-final-d').textContent = `总收益 ${spct(m.total)} · 基准 ${spct((result.nav[result.nav.length-1][2]/P.cash)-1)}`;
    $('k-final-d').className = 'delta ' + (m.total >= 0 ? 'up' : 'down');
    $('k-ann').textContent = pct(m.ann);
    $('k-ann-d').textContent = `基准 ${pct(m.bann)} · 超额 ${spct(m.ann-m.bann)}`;
    $('k-ann-d').className = 'delta ' + (m.ann >= m.bann ? 'up' : 'down');
    $('k-dd').textContent = pct(m.mdd);
    $('k-dd-d').textContent = `基准 ${pct(m.bmdd)}`;
    $('k-dd-d').className = 'delta ' + (Math.abs(m.mdd) <= Math.abs(m.bmdd) ? 'up' : 'down');
    $('k-sharpe').textContent = m.sharpe.toFixed(2) + ' / ' + pct(m.win);
    $('k-turn').textContent = `换手 ${m.turn.toFixed(1)}x · 佣金 ${fmt.format(Math.round(m.comm))}元`;
    const tb = $('trBody'); tb.textContent = '';
    for (const t of result.trades.slice(-50).reverse()) {
      const tr = document.createElement('tr');
      [D.dates[t[0]], t[2]==='buy'?'买':'卖', D.names[t[1]], fmt.format(t[3]), t[4].toFixed(3)]
        .forEach((v,k) => { const td = document.createElement('td'); td.textContent = v;
          if (k===1) td.style.color = t[2]==='buy' ? cssVar('--s1') : cssVar('--s2');
          if (k>=3) td.className='num'; tr.appendChild(td); });
      tb.appendChild(tr);
    }
    renderCharts(result, m);
    $('navChart').classList.remove('loading'); $('ddChart').classList.remove('loading');
  }, 30);
}
$('runBtn').onclick = renderAll;
$('cap').addEventListener('input', renderSignal);

// ============ 在线更新（东财直连，失败则保留快照） ============
$('refreshBtn').onclick = async () => {
  toast('正在更新数据…', 10000);
  try {
    const secid = c => (c.startsWith('5') ? '1.' : '0.') + c;
    const txSym = c => (c.startsWith('5') ? 'sh' : 'sz') + c;
    const fetchEast = async c => {   // 东财 hfq + 最新真实价
      const k = async fqt => {
        const u = `https://push2his.eastmoney.com/api/qt/stock/kline/get?fields1=f1,f2&fields2=f51,f52,f53&klt=101&fqt=${fqt}&secid=${secid(c)}&beg=0&end=20500101&ut=7eea3edcaed734bea9cbfc24409ed989`;
        const j = await (await fetch(u)).json();
        return j.data && j.data.klines ? j.data.klines.map(x => x.split(',')) : null;
      };
      const hfq = await k(2); if (!hfq) return null;
      const raw = await k(0);
      return { dates: hfq.map(x => x[0]), close: hfq.map(x => +x[2]),
        open: hfq.map(x => +x[1]), rawLast: raw ? +raw[raw.length-1][2] : null };
    };
    const fetchTx = async c => {     // 腾讯兜底（hfq + 最新真实价）
      const k = async fq => {
        const u = `https://ifzq.gtimg.cn/appstock/app/fqkline/get?param=${txSym(c)},day,,,900,${fq}`;
        const j = await (await fetch(u)).json();
        const node = j.data && j.data[txSym(c)];
        if (!node) return null;
        // 有分红调整的代码在 hfqday，从未分红的退回 day（两者即同值）
        const arr = fq === 'hfq' ? (node.hfqday || node.day) : node.day;
        return arr ? arr.filter(x => typeof x[0] === 'string') : null;
      };
      let hfq = await k('hfq');
      if (!hfq) return null;
      const raw = await k('');
      return { dates: hfq.map(x => x[0]), close: hfq.map(x => +x[2]),
        open: hfq.map(x => +x[1]), rawLast: raw ? +raw[raw.length-1][2] : null };
    };
    // 先整批走东财，任一失败则整批切腾讯（避免两家的后复权锚点混用污染动量）
    let fetched = null, src = '';
    try {
      fetched = {};
      for (const c of D.codes) {
        fetched[c] = await fetchEast(c); if (!fetched[c]) throw new Error('east incomplete');
        await new Promise(r => setTimeout(r, 250));
      }
      src = '东财';
    } catch (e) {
      fetched = {};
      for (const c of D.codes) {
        fetched[c] = await fetchTx(c); if (!fetched[c]) throw new Error('腾讯源也不可用');
        await new Promise(r => setTimeout(r, 250));
      }
      src = '腾讯';
    }
    // 重建并集日历，逐代码对齐（缺的日期填 null）
    const union = [...new Set([...D.dates, ...Object.values(fetched).flatMap(f => f.dates)])].sort();
    for (const c of D.codes) {
      const f = fetched[c];
      const fIdx = new Map(f.dates.map((d, k) => [d, k]));
      // 锚点换算：保留拉取段（最新源锚点），旧段按重叠日换算到同一锚点续接
      const firstCommon = f.dates.find(d => D.dates.includes(d));
      let ratio = 1;
      if (firstCommon) {
        const bIdx = D.dates.indexOf(firstCommon), fIdx0 = fIdx.get(firstCommon);
        // ratio = 新锚/旧锚（旧段 × ratio 后与新段同锚）
        if (D.close[c][bIdx] != null && f.close[fIdx0]) ratio = f.close[fIdx0] / D.close[c][bIdx];
      }
      const bMap = new Map(D.dates.map((d, k) => [d, k]));
      const nc = [], no = [];
      for (const d of union) {
        let cv = null, ov = null;
        if (fIdx.has(d)) { cv = f.close[fIdx.get(d)]; ov = f.open[fIdx.get(d)]; }
        else if (bMap.has(d) && (!firstCommon || d < firstCommon)) {
          const k = bMap.get(d);
          cv = D.close[c][k] == null ? null : D.close[c][k] * ratio;
          ov = D.open[c][k] == null ? null : D.open[c][k] * ratio;
        }
        nc.push(cv == null ? null : +cv.toFixed(3)); no.push(ov == null ? null : +ov.toFixed(3));
      }
      D.close[c] = nc; D.open[c] = no;
      if (f.rawLast != null) D.rawLast[c] = +f.rawLast.toFixed(3);
    }
    D.dates = union;
    D.asOf = union[union.length - 1];
    $('asOfTag').textContent = '数据截至 ' + D.asOf;
    renderAll();
    toast('已更新至 ' + D.asOf + '（' + D.codes.length + ' 只，' + src + '）');
  } catch (e) {
    toast('在线更新不可用（' + e.message + '），使用内置数据截至 ' + D.asOf);
  }
};

window.addEventListener('resize', () => Object.values(CHARTS).forEach(c => c.resize()));
$('asOfTag').textContent = '数据截至 ' + D.asOf;
renderAll();
</script>
